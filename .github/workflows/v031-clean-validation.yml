name: V0.3.1 clean reproducibility validation

on:
  push:
    branches:
      - validation/v031-clean-validation-2026-11-26
    paths:
      - ".github/workflows/v031-clean-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prouve-v031-clean-validation
  cancel-in-progress: false

jobs:
  clean-validation:
    name: Verify frozen V0.3.1 archive, 113 tests, and 3 pipelines
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout frozen source commit
        uses: actions/checkout@v4
        with:
          ref: 077fb968f5ad2358ee66a459c43920aaa983bb6e
          fetch-depth: 1

      - name: Confirm exact source revision and required files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "077fb968f5ad2358ee66a459c43920aaa983bb6e"
          test -s "PROUVE_Spatial_Engine_Branch_V0_3_1.zip"
          test -s "PROUVE_Spatial_Engine_Branch_V0_3_1.zip.sha256"
          test -s "V0_3_1_SOURCE_SHA256SUMS.txt"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify archive SHA-256, safely extract, and verify all 52 manifest entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prouve-v031-extract" "validation-results"
          python - <<'PY'
          import hashlib
          import os
          import re
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd()
          archive = repo / "PROUVE_Spatial_Engine_Branch_V0_3_1.zip"
          sidecar = repo / "PROUVE_Spatial_Engine_Branch_V0_3_1.zip.sha256"
          manifest = repo / "V0_3_1_SOURCE_SHA256SUMS.txt"
          destination = Path(os.environ["RUNNER_TEMP"]) / "prouve-v031-extract"

          match = re.search(
              r"^([0-9a-f]{64})\s+PROUVE_Spatial_Engine_Branch_V0_3_1\.zip\s*$",
              sidecar.read_text(encoding="utf-8"), re.M
          )
          if not match:
              raise SystemExit("FAIL: ZIP sidecar format is invalid")
          expected_zip_hash = match.group(1)
          actual_zip_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          print(f"ZIP_SHA256_EXPECTED={expected_zip_hash}")
          print(f"ZIP_SHA256_ACTUAL={actual_zip_hash}")
          if actual_zip_hash != expected_zip_hash:
              raise SystemExit("FAIL: ZIP SHA-256 does not match the sidecar")

          with zipfile.ZipFile(archive) as zf:
              bad_member = zf.testzip()
              if bad_member:
                  raise SystemExit(f"FAIL: ZIP CRC check failed at {bad_member}")
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  p = PurePosixPath(name)
                  mode = (info.external_attr >> 16) & 0o170000
                  if p.is_absolute() or ".." in p.parts or name.startswith("/"):
                      raise SystemExit(f"FAIL: unsafe ZIP path: {info.filename}")
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f"FAIL: symbolic link in ZIP: {info.filename}")
              zf.extractall(destination)

          candidates = list(destination.rglob("engine/pipeline_runner_v03.py"))
          roots = sorted({p.parent.parent for p in candidates})
          if len(roots) != 1:
              raise SystemExit(f"FAIL: expected one V0.3.1 source root; found {len(roots)}")
          source_root = roots[0]
          print(f"SOURCE_ROOT={source_root}")

          entries = []
          for line_no, line in enumerate(manifest.read_text(encoding="utf-8").splitlines(), 1):
              line = line.strip()
              if not line:
                  continue
              parts = line.split(maxsplit=1)
              if len(parts) != 2 or not re.fullmatch(r"[0-9a-f]{64}", parts[0]):
                  raise SystemExit(f"FAIL: invalid manifest line {line_no}: {line}")
              rel = PurePosixPath(parts[1])
              if rel.is_absolute() or ".." in rel.parts:
                  raise SystemExit(f"FAIL: unsafe manifest path on line {line_no}")
              entries.append((parts[0], str(rel)))

          if len(entries) != 52:
              raise SystemExit(f"FAIL: expected 52 manifest entries, found {len(entries)}")
          seen = set()
          for expected, rel in entries:
              if rel in seen:
                  raise SystemExit(f"FAIL: duplicate manifest path: {rel}")
              seen.add(rel)
              path = source_root / rel
              if not path.is_file():
                  raise SystemExit(f"FAIL: missing source file: {rel}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"FAIL: SHA-256 mismatch: {rel} expected={expected} actual={actual}")

          print(f"MANIFEST_ENTRIES_VERIFIED={len(entries)}")
          print("ARCHIVE_CRC=PASS")
          print("ZIP_SHA256=PASS")
          print("SOURCE_MANIFEST=PASS")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PROUVE_SOURCE_ROOT={source_root}\n")
          PY

      - name: Install pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.3.5" "shapely==2.1.2"
          python - <<'PY'
          import numpy, shapely, sys
          print("PYTHON", sys.version)
          print("NUMPY", numpy.__version__)
          print("SHAPELY", shapely.__version__)
          PY

      - name: Compile source packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROUVE_SOURCE_ROOT"
          python -m compileall -q engine adapter prototype tests
          echo "COMPILEALL=PASS"

      - name: Re-run the complete 113-test suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROUVE_SOURCE_ROOT"
          export PYTHONPATH="$PROUVE_SOURCE_ROOT:$PROUVE_SOURCE_ROOT/engine:$PROUVE_SOURCE_ROOT/adapter:$PROUVE_SOURCE_ROOT/prototype"
          python - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/validation-results/tests.log"
          import importlib.util
          import sys
          import unittest
          from pathlib import Path

          root = Path.cwd()
          folders = ("tests", "engine", "adapter", "prototype")
          files = sorted({
              p for folder in folders
              for p in (root / folder).rglob("test_*.py")
              if p.is_file()
          })
          if not files:
              raise SystemExit("FAIL: no test modules found")

          suite = unittest.TestSuite()
          loader = unittest.TestLoader()
          for index, path in enumerate(files):
              rel = path.relative_to(root).as_posix()
              module_name = "prouve_clean_test_" + str(index) + "_" + rel.replace("/", "_").replace(".", "_")
              spec = importlib.util.spec_from_file_location(module_name, path)
              if spec is None or spec.loader is None:
                  raise SystemExit(f"FAIL: cannot load test module {rel}")
              module = importlib.util.module_from_spec(spec)
              sys.modules[module_name] = module
              spec.loader.exec_module(module)
              suite.addTests(loader.loadTestsFromModule(module))

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"TEST_MODULES={len(files)}")
          print(f"TESTS_RUN={result.testsRun}")
          if result.testsRun != 113 or not result.wasSuccessful():
              raise SystemExit("FAIL: expected exactly 113 passing tests")
          print("TEST_SUITE_113=PASS")
          PY

      - name: Re-run rectangular, MultiPolygon-with-hole, and empty-geometry pipelines
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROUVE_SOURCE_ROOT"
          export PYTHONPATH="$PROUVE_SOURCE_ROOT:$PROUVE_SOURCE_ROOT/engine:$PROUVE_SOURCE_ROOT/adapter:$PROUVE_SOURCE_ROOT/prototype"
          python - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/validation-results/pipelines.log"
          import json
          import os
          from pathlib import Path
          from engine.pipeline_runner_v03 import run_pipeline_v03

          root = Path.cwd()
          results_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "validation-results" / "pipelines"
          results_dir.mkdir(parents=True, exist_ok=True)

          cases = [
              {
                  "id": "rectangular",
                  "app": root / "adapter" / "sample_app_project.json",
                  "profile": root / "adapter" / "sample_site_profile.json",
                  "grid": 144,
                  "expected_status": "SYNTHETIC_PIPELINE_PASS_FEASIBILITY_CERTIFIED_EXPLORATORY_ONLY",
                  "expected_best": 70,
                  "expected_ub": 77,
              },
              {
                  "id": "multipolygon_hole",
                  "app": root / "fixtures" / "multipolygon_hole_app_project.json",
                  "profile": root / "fixtures" / "multipolygon_hole_site_profile.json",
                  "grid": 64,
                  "expected_status": "SYNTHETIC_PIPELINE_PASS_FEASIBILITY_CERTIFIED_EXPLORATORY_ONLY",
                  "expected_best": 153,
                  "expected_ub": 209,
              },
              {
                  "id": "empty_geometry",
                  "app": root / "fixtures" / "empty_geometry_app_project.json",
                  "profile": root / "fixtures" / "empty_geometry_site_profile.json",
                  "grid": 64,
                  "expected_status": "HOLD_EMPTY_USABLE_GEOMETRY",
                  "expected_best": 0,
                  "expected_ub": 0,
              },
          ]

          summaries = []
          for case in cases:
              for key in ("app", "profile"):
                  if not case[key].is_file():
                      raise SystemExit(f"FAIL: missing {case[key]}")
              report = run_pipeline_v03(
                  case["app"],
                  case["profile"],
                  results_dir / case["id"],
                  mode="exploratory",
                  max_wall_time_seconds=3.0,
                  max_grid_evaluations=case["grid"],
                  allow_phase_arrangement=True,
                  allow_orientation_bnb=False,
              )
              item = {
                  "case": case["id"],
                  "status": report["pipeline_status"],
                  "best_found": report["optimization"]["best_found_count"],
                  "certified_upper_bound": report["optimization"]["upper_bound_count"],
                  "optimality_proven": report["optimization"]["optimality_proven"],
                  "field_deployment_authorized": report["field_deployment_authorized"],
                  "all_formal_checks_passed": report["verification"]["all_formal_checks_passed"],
                  "run_id": report["run_id"],
              }
              summaries.append(item)
              print(json.dumps(item, ensure_ascii=False))
              if item["status"] != case["expected_status"]:
                  raise SystemExit(f"FAIL: {case['id']} status mismatch")
              if item["best_found"] != case["expected_best"] or item["certified_upper_bound"] != case["expected_ub"]:
                  raise SystemExit(f"FAIL: {case['id']} counts mismatch")
              if item["field_deployment_authorized"]:
                  raise SystemExit(f"FAIL: {case['id']} must not authorize field deployment")
              if case["id"] != "empty_geometry" and not item["all_formal_checks_passed"]:
                  raise SystemExit(f"FAIL: {case['id']} formal checks did not pass")
              if case["id"] != "empty_geometry" and item["optimality_proven"]:
                  raise SystemExit(f"FAIL: {case['id']} unexpectedly claimed optimality")

          (results_dir / "pipeline_summary.json").write_text(
              json.dumps(summaries, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("PIPELINE_CASES=3/3")
          print("PIPELINE_REGRESSION=PASS")
          PY

      - name: Upload clean validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prouve-v031-clean-validation
          path: validation-results/
          if-no-files-found: warn
          retention-days: 90
